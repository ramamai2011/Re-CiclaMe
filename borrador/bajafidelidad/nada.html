<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re-CiclaMe · Crear cuenta</title>
    <link rel="stylesheet" href="nada.css" />
  </head>
  <body>
    <div class="adentrocuadrado">
      <div class="parteizquieda">
        <p class="titulo">Re-CiclaMe</p>
        <p class="textobienvenida">
          Creá tu cuenta y comenzá a reciclar para obtener beneficios cuidando
          de nuestro planeta.
        </p>
      </div>

      <div class="partederecha">
        <div class="lostextos">
          <h1 class="titulo">¡Bienvenido!</h1>
          <p class="p">Completá los datos para crear cuenta</p>
        </div>

        <div class="preguntas">
          <p class="chico">Email</p>
          <div class="losrec">
            <input class="escribir" type="email" placeholder="ejemplo@ejemplo.com" required />
          </div>

          <p class="chico">Nombre de usuario</p>
          <div class="losrec">
            <input class="escribir" type="text"placeholder="Elegí un nombre de usuario"
              required
            />
          </div>

          <p class="chico">Contraseña</p>
          <div class="losrec">
            <input class="escribir"
              type="password"
              placeholder="Creá una contraseña segura"
              required
            />
          </div>

          <p class="chico">Repetir contraseña</p>
          <div class="losrec">
            <input class="escribir"
              type="password"
              placeholder="Volvé a escribir la contraseña"
              required
            />
          </div>

          <p class="chico">Código postal</p>
          <div class="losrec">
            <input class="escribir" type="text" placeholder="Ej. 1428" required />
          </div>

          <button class="botoncrear">Crear cuenta</button>
        </form>
      </div>
    </div>
  </div>
  </body>
</html>
