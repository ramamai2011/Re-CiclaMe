<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-CiclaMe · Crear cuenta</title>
    <link rel="stylesheet" href="nada.css">
</head>
<body>
    <div class="adentrocuadrado">

        <div class="parteizquieda">
            <p class="titulo">Re-CiclaMe</p>
            <p class="textobienvenida">Creá tu cuenta y comenzá a reciclar para obtener beneficios cuidando de nuestro planeta.</p>
        </div>

        <div class="partederecha">
            <div class="lostextos">
                <h1 class="titulo">¡Bienvenido!</h1>
                <p class="p">Completá los datos para crear cuenta</p>
            </div>

            <form class="elformulario">
                <p class="chico">Email</p>
                <div class="losrec">
                    <svg class="iconorec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 6l8 7 8-7"/></svg>
                    <input type="email" placeholder="ejemplo@ejemplo.com" required>
                </div>

                <p class="chico">Nombre de usuario</p>
                <div class="losrec">
                    <svg class="iconorec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                    <input type="text" placeholder="Elegí un nombre de usuario" required>
                </div>

                <p class="chico">Contraseña</p>
                <div class="losrec">
                    <svg class="iconorec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    <input type="password" placeholder="Creá una contraseña segura" required>
                </div>

                <p class="chico">Repetir contraseña</p>
                <div class="losrec">
                    <svg class="iconorec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    <input type="password" placeholder="Volvé a escribir la contraseña" required>
                </div>

                <p class="chico">Código postal</p>
                <div class="losrec">
                    <svg class="iconorec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    <input type="text" placeholder="Ej. 1428" required>
                </div>

                <button type="submit" class="botoncrear">Crear cuenta</button>
            </form>
        </div>

    </div>
</body>
</html>
