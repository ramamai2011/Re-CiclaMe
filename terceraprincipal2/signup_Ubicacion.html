<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
  <body>
    <div class="cuadradoentero">
        <div class="reccontitulos">
        <img class="logo" src="../Assets/Assets/brand/logo-sintext.png" alt="">
        <p class="titulo">Re-CiclaMe</p>
        <p class="bienvenido">Ubicación</p> </div>
        <p class="textobienvenida">
            Ingresá tu código postal o permitinos tu ubicación.</p>

          <div class="losrec">
            <svg class="svg" xmlns="http://www.w3.org/2000/svg" width="21" height="26" viewBox="0 0 21 26" fill="none">
                <path d="M10.5 14.0625C12.4675 14.0625 14.0625 12.4675 14.0625 10.5C14.0625 8.53249 12.4675 6.9375 10.5 6.9375C8.53249 6.9375 6.9375 8.53249 6.9375 10.5C6.9375 12.4675 8.53249 14.0625 10.5 14.0625Z" stroke="#1F8527" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.78249 3.78249C5.56408 2.00089 7.98044 1 10.5 1C13.0196 1 15.4359 2.00089 17.2175 3.78249C18.9991 5.56408 20 7.98044 20 10.5C20 12.7467 19.5226 14.2169 18.2188 15.8438L10.5 24.75L2.78125 15.8438C1.47737 14.2169 1 12.7467 1 10.5C1 7.98044 2.00089 5.56408 3.78249 3.78249Z" stroke="#1F8527" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
                        <input id="correo" class="escribir" type="email" placeholder="Código postal de CABA." required />
          </div>
          <button class="botonsiguiente"><p class="siguientetxt">Siguiente</p></button>
          <h3 id="respuesta_registro"></h3>
          <script>
            const button = document.querySelector("button");
            const respuesta_registro = document.getElementById("respuesta_registro");
          
            button.addEventListener("click", async () => {
              try {
                const correo = document.getElementById("correo").value;
          
                const respuesta = await fetch("http://localhost:3000/api/register/correo/button", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ correo }),
                });
          
                if (!respuesta.ok) {
                  const errorData = await respuesta.json();
                  respuesta_registro.innerHTML = errorData.mensaje || "Error en la solicitud.";
                  return;
                }
          
                const datos = await respuesta.json();
                respuesta_registro.innerHTML = datos.mensaje;
              } catch (error) {
                console.error("Error al enviar el correo:", error);
                respuesta_registro.innerHTML = "Hubo un error al registrar el correo.";
              }
            });
          </script>
      </div>
  </body>
</html>
