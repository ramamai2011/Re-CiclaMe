<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="signup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
  <body>
    <div class="adentrocuadrado">
      <div class="parteizquieda">
        <img class="logo" src="../Assets/Assets/brand/logo-sintext.png" alt="">
        <p class="titulo">Re-CiclaMe</p>
        <p class="textobienvenida">
          Creá tu cuenta y comenzá a reciclar para obtener beneficios cuidando
          de nuestro planeta.
        </p>
        <img class="reciclaimg" src="../Assets/Assets/general/1598167.png" alt="">
        <div class="lineaverde"></div>
      </div>
      <div class="partederecha">
        <h1 class="tiitulo">¡Bienvenido!</h1>
        <p class="p">Completá los datos para crear cuenta</p>
      <p class="chico">Email</p>
      <div class="losrec">
        <img class="img" src="../Assets/Assets/general/mail.svg" alt="">
        <input id="correo" class="escribir" type="email" placeholder="ejemplo@ejemplo.com" required />
      </div>
      <p class="chico">Nombre de usuario</p>

      <div class="losrec">
        <img src="" alt="">
        <input id="nombre" class="escribir" type="text" placeholder="Elegí un nombre de usuario" required
      />
      </div>
      <p class="chico">Contraseña</p>
      <div class="losrec">
        <img class="img" src="../Assets/Assets/general/key.svg" alt="">
        <input id="clave" class="escribir"type="password"placeholder="Creá una contraseña segura"required
      />
      </div>

      <p class="chico">Repetir</p>
      <div class="losrec">
        <img class="img" src="../Assets/Assets/general/key.svg" alt="">
        <input id="clave_repetida" class="escribir"type="password"placeholder="Volvé a escribir la contraseña" required
            /></div>
      <p class="chico">Código postal</p>

      <div class="losrec">
        <img class="img" src="../Assets/Assets/general/map pin.svg  " alt="">
        <input id="postal" class="escribir" type="text" placeholder="Ej. 1428" required />
      </div>
      <button id="boton_registro" class="crearcuenta" type="button">Crear cuenta</button>
    </div>
  </div>
      <script>
        const boton = document.getElementById("boton_registro");

        boton?.addEventListener("click", async () => {
    const correo = (document.getElementById("correo")).value;
    const nombre = (document.getElementById("nombre")).value;
    const clave = (document.getElementById("clave")).value;
    const clave_repetida = (document.getElementById("clave_repetida")).value;
    const postal = (document.getElementById("postal")).value;
    const resultado_registro = document.getElementById("resultado-registro")

    try {
      const respuesta = await fetch("http://localhost:3000/api/register/button", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          correo,
          nombre,
          clave,
          clave_repetida,
          postal
        })
      });
      const datos = await respuesta.json();
      resultado_registro.innerHTML = datos.mensaje;
    } catch (error) {
      resultado_registro.innerHTML = "No se pudo completar el registro. Intentá nuevamente.";
      console.error("Error al registrar usuario:", error);
    }
});
      </script>
  <h2 class="BORRALO LUKA" id="resultado-registro"></h2>
  </body>
</html>
