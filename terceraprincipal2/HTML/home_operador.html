    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const correo = localStorage.getItem("correoUsuario");

        if (!correo) {
          alert(
            "No se encontró un usuario registrado. Redirigiendo al login...",
          );
          window.location.href = "/terceraprincipal2/HTML/login.html";
          return;
        }

        try {
          const respuesta = await fetch(
            "http://localhost:3000/api/usuario/datos",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ correo }),
            },
          );

          if (!respuesta.ok) {
            throw new Error("Error al obtener los datos del usuario");
          }

          const datos = await respuesta.json();

          // Mostrar los datos en la interfaz
          const holausu = document.querySelector(".textousuario");
          holausu.textContent = `Hola, ${datos.nombre}`;
          const puntos = document.querySelector(".numeropuntos");
          puntos.textContent = datos.puntos;
        } catch (error) {
          console.error("Error:", error);
          alert("Hubo un problema al cargar los datos del usuario.");
        }
      });
    </script>
