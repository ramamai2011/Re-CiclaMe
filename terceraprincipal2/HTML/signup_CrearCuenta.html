  <body>
    <div class="cuadradoentero">
      <div class="reccontitulos">
        <img
          class="logo"
          src="../Assets/Assets/brand/logo-sintext.png"
          alt=""
        />
        <p class="titulo">Re-CiclaMe</p>
        <p class="bienvenido">Creá tu cuenta</p>
      </div>
      <p class="textobienvenida">Démosle identidad y seguridad a tu cuenta.</p>

      <div class="losrec">
        <svg
          class="svg"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="22"
          viewBox="0 0 20 22"
          fill="none"
        >
          <path
            d="M19 21C18.43 9.148 1.57 9.148 1 21M15.625 6.556C15.6242 7.28726 15.4781 8.01106 15.1952 8.68537C14.9122 9.35969 14.4982 9.97107 13.977 10.484C12.9166 11.5277 11.4879 12.1118 10 12.11C8.512 12.1115 7.08326 11.527 6.023 10.483C5.50182 9.97007 5.08775 9.35869 4.80484 8.68437C4.52193 8.01006 4.37582 7.28626 4.375 6.555C4.375 5.081 4.968 3.668 6.023 2.626C7.08342 1.58235 8.51215 0.998216 10 1C11.492 1 12.923 1.585 13.977 2.627C14.4983 3.14006 14.9124 3.7516 15.1954 4.4261C15.4783 5.10059 15.6243 5.82458 15.625 6.556Z"
            stroke="#1F8527"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <input
          id="correo"
          class="escribir"
          type="email"
          placeholder="Ingresá tu nombre de usuario"
          required
        />
      </div>

      <div class="losrec">
        <svg
          class="svg"
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 22 22"
          fill="none"
        >
          <path
            d="M18.0934 13.4398C16.9412 14.2499 15.5672 14.6847 14.1588 14.6849C13.7194 14.6842 13.2914 14.6442 12.8745 14.5649C12.0871 14.4154 11.6923 14.3406 11.4428 14.4175C11.1934 14.4933 10.9723 14.7143 10.5302 15.1565L8.89536 16.7902H6.78999V18.8956H4.68463V21.001H1.00024V19.0619C1.00024 18.2008 1.0013 17.7703 1.1613 17.3829C1.32131 16.9955 1.62554 16.6913 2.23504 16.0828L6.84368 11.4773C7.28686 11.0342 7.50687 10.812 7.58477 10.5626C7.66202 10.3152 7.58812 9.92487 7.4411 9.14842L7.43739 9.12881C7.17261 7.7455 7.34115 6.31419 7.92 5.03022C8.49886 3.74625 9.45983 2.67219 10.6717 1.95463C11.8837 1.23708 13.2875 0.910982 14.6916 1.02086C16.0958 1.13074 17.4318 1.67123 18.5173 2.56858C19.6029 3.46592 20.3851 4.67639 20.7571 6.03477C21.1292 7.39315 21.0731 8.83326 20.5963 10.1585C20.1196 11.4838 19.2455 12.6297 18.0934 13.4398Z"
            stroke="#1F8527"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

            d="M17.3167 6.26335C17.3167 6.68213 17.1504 7.08376 16.8542 7.37989C16.5581 7.67601 16.1565 7.84237 15.7377 7.84237C15.3189 7.84237 14.9173 7.67601 14.6212 7.37989C14.3251 7.08376 14.1587 6.68213 14.1587 6.26335C14.1587 5.84457 14.3251 5.44293 14.6212 5.14681C14.9173 4.85069 15.3189 4.68433 15.7377 4.68433C16.1565 4.68433 16.5581 4.85069 16.8542 5.14681C17.1504 5.44293 17.3167 5.84457 17.3167 6.26335Z"
            stroke="#1F8527"
            stroke-width="2"
          />
        </svg>
        <input
          id="contraseña"
          class="escribir"
          type="password"
          placeholder="Creá tu contraseña"
          required
        />
      </div>
      <button class="botonsiguiente">
        <p class="siguientetxt">Siguiente</p>
      </button>
      <h3 id="respuesta_registro"></h3>
      <script>
        const button = document.querySelector("button");
        const respuesta_registro =
          document.getElementById("respuesta_registro");

        button.addEventListener("click", async () => {
          try {
            const correo = sessionStorage.getItem("correoRegistro");

            const respuesta = await fetch(
              "http://localhost:3000/api/register/correo/button",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ correo }),
              },
            );

            if (!respuesta.ok) {
              const errorData = await respuesta.json();
              respuesta_registro.innerHTML =
                errorData.mensaje || "Error en la solicitud.";
              return;
            }

            const datos = await respuesta.json();
            respuesta_registro.innerHTML = datos.mensaje;
          } catch (error) {
            console.error("Error al enviar el correo:", error);
            respuesta_registro.innerHTML =
              "Hubo un error al registrar el correo.";
          }
        });
      </script>
    </div>
  </body>
</html>
